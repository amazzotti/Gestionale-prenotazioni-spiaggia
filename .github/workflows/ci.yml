name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    name: Analisi e test Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applicazione_gestionale
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  firestore-rules:
    name: Test regole Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
        working-directory: firestore-tests
      - name: Emulatore Firestore + test
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-spiaggia "npm --prefix firestore-tests test"
